stages:
  get-seed-data:
    cmd: ' bash --noprofile --norc -c "uvx gdown https://drive.google.com/uc?id=126uLk7xah2EpJR741ziPO-cxQ43nZUoL
      -O ./data/alerts/boom_throughput.ZTF_alerts_aux_before_fix.dump.gz"'
    deps: []
    outs:
      - data/alerts/boom_throughput.ZTF_alerts_aux_before_fix.dump.gz
    desc: Automatically generated from the 'get-seed-data' stage in 
      calkit.yaml. Changes made here will be overwritten.
  fix-seed-data:
    cmd: ' bash --noprofile --norc fix-seed-data/run.sh'
    deps:
      - fix-seed-data/run.sh
      - data/alerts/boom_throughput.ZTF_alerts_aux_before_fix.dump.gz
      - fix-seed-data/compose.yaml
      - fix-seed-data/mongo-init.sh
      - fix-seed-data/config.yaml
      - fix-seed-data/boom/Dockerfile
      - fix-seed-data/dump-seed-data.sh
      - fix-seed-data/boom/Cargo.toml
      - fix-seed-data/boom/Cargo.lock
      - fix-seed-data/boom/src
    outs:
      - data/alerts/boom_throughput.ZTF_alerts_aux.dump.gz
      - fix-seed-data/logs
    desc: Automatically generated from the 'fix-seed-data' stage in 
      calkit.yaml. Changes made here will be overwritten.
  benchmark-boom:
    cmd: calkit xenv -n run --no-check -- python 
      boom/tests/throughput/run.py 
      --n-alert-workers=${item.n_alert_workers} 
      --n-ml-workers=${item.n_ml_workers} 
      --n-filter-workers=${item.n_filter_workers}
    deps:
      - boom/tests/throughput/run.py
      - boom/src
      - boom/Cargo.lock
      - boom/Cargo.toml
      - boom/config.yaml
      - boom/Dockerfile
      - boom/tests/throughput/compose.yaml
      - boom/tests/throughput/mongo-init.sh
      - boom/tests/throughput/cats150.pipeline.json
      - boom/tests/throughput/read-kafka-output.py
      - boom/tests/throughput/_run.sh
      - data/alerts/kowalski.NED.json.gz
      - data/alerts/boom_throughput.ZTF_alerts_aux.dump.gz
      - .calkit/env-locks/run
    outs:
      - logs/boom-na=${item.n_alert_workers}-nml=${item.n_ml_workers}-nf=${item.n_filter_workers}
    matrix:
      n_alert_workers:
        - 1
        - 3
        - 6
      n_ml_workers:
        - 3
        - 6
        - 9
      n_filter_workers:
        - 1
        - 3
    desc: Automatically generated from the 'benchmark-boom' stage in 
      calkit.yaml. Changes made here will be overwritten.
  benchmark-boom-more:
    cmd: calkit xenv -n run --no-check -- python 
      scripts/benchmark-boom.py 
      --n-alert-workers=${item._arg0.n_alert_workers} 
      --n-ml-workers=${item._arg0.n_ml_workers} 
      --n-filter-workers=${item._arg0.n_filter_workers}
    deps:
      - scripts/benchmark-boom.py
      - boom/src
      - boom/Cargo.lock
      - boom/Cargo.toml
      - scripts/benchmark-boom.sh
      - config/boom/config-template.yaml
      - config/boom/compose.yaml
      - Dockerfile-boom
      - scripts/mongo-init.sh
      - data/kowalski.NED.json.gz
      - config/boom/cats150.boom.json
      - .calkit/env-locks/run
    outs:
      - logs/boom-na=${item._arg0.n_alert_workers}-nml=${item._arg0.n_ml_workers}-nf=${item._arg0.n_filter_workers}
    matrix:
      _arg0:
        - n_alert_workers: 1
          n_ml_workers: 1
          n_filter_workers: 1
        - n_alert_workers: 1
          n_ml_workers: 2
          n_filter_workers: 1
        - n_alert_workers: 2
          n_ml_workers: 2
          n_filter_workers: 1
        - n_alert_workers: 3
          n_ml_workers: 4
          n_filter_workers: 1
        - n_alert_workers: 4
          n_ml_workers: 6
          n_filter_workers: 1
        - n_alert_workers: 4
          n_ml_workers: 7
          n_filter_workers: 1
        - n_alert_workers: 5
          n_ml_workers: 8
          n_filter_workers: 1
        - n_alert_workers: 5
          n_ml_workers: 5
          n_filter_workers: 1
        - n_alert_workers: 6
          n_ml_workers: 10
          n_filter_workers: 1
        - n_alert_workers: 7
          n_ml_workers: 11
          n_filter_workers: 1
        - n_alert_workers: 8
          n_ml_workers: 13
          n_filter_workers: 1
        - n_alert_workers: 9
          n_ml_workers: 15
          n_filter_workers: 1
        - n_alert_workers: 9
          n_ml_workers: 14
          n_filter_workers: 2
    desc: Automatically generated from the 'benchmark-boom-more' stage
      in calkit.yaml. Changes made here will be overwritten.
  benchmark-kowalski:
    cmd: calkit xenv -n run --no-check -- python 
      scripts/benchmark-kowalski.py --n-workers=${item.n_workers}
    deps:
      - scripts/benchmark-kowalski.py
      - config/kowalski/config-template.yaml
      - config/kowalski/compose.yaml
      - config/kowalski/supervisord.conf
      - kowalski/ingester.Dockerfile
      - kowalski/kowalski
      - kowalski/Makefile
      - kowalski/requirements
      - scripts/mongo-init.sh
      - scripts/benchmark-kowalski.sh
      - data/kowalski.NED.json.gz
      - config/kowalski/cats150.kowalski.json
      - .calkit/env-locks/run
    outs:
      - logs/kowalski-n=${item.n_workers}
    matrix:
      n_workers:
        - 3
        - 6
        - 7
        - 9
        - 12
        - 15
        - 20
        - 25
    desc: Automatically generated from the 'benchmark-kowalski' stage 
      in calkit.yaml. Changes made here will be overwritten.
  analyze-logs:
    cmd: calkit nb execute --environment analyze-logs --no-check --to 
      html "notebooks/analyze-logs.ipynb"
    deps:
      - .calkit/notebooks/cleaned/notebooks/analyze-logs.ipynb
      - .calkit/env-locks/analyze-logs
      - logs/boom-na=1-nml=3-nf=1
      - logs/boom-na=1-nml=3-nf=3
      - logs/boom-na=1-nml=6-nf=1
      - logs/boom-na=1-nml=6-nf=3
      - logs/boom-na=1-nml=9-nf=1
      - logs/boom-na=1-nml=9-nf=3
      - logs/boom-na=3-nml=3-nf=1
      - logs/boom-na=3-nml=3-nf=3
      - logs/boom-na=3-nml=6-nf=1
      - logs/boom-na=3-nml=6-nf=3
      - logs/boom-na=3-nml=9-nf=1
      - logs/boom-na=3-nml=9-nf=3
      - logs/boom-na=6-nml=3-nf=1
      - logs/boom-na=6-nml=3-nf=3
      - logs/boom-na=6-nml=6-nf=1
      - logs/boom-na=6-nml=6-nf=3
      - logs/boom-na=6-nml=9-nf=1
      - logs/boom-na=6-nml=9-nf=3
      - logs/boom-na=1-nml=1-nf=1
      - logs/boom-na=1-nml=2-nf=1
      - logs/boom-na=2-nml=2-nf=1
      - logs/boom-na=3-nml=4-nf=1
      - logs/boom-na=4-nml=6-nf=1
      - logs/boom-na=4-nml=7-nf=1
      - logs/boom-na=5-nml=8-nf=1
      - logs/boom-na=5-nml=5-nf=1
      - logs/boom-na=6-nml=10-nf=1
      - logs/boom-na=7-nml=11-nf=1
      - logs/boom-na=8-nml=13-nf=1
      - logs/boom-na=9-nml=15-nf=1
      - logs/boom-na=9-nml=14-nf=2
      - logs/kowalski-n=3
      - logs/kowalski-n=6
      - logs/kowalski-n=7
      - logs/kowalski-n=9
      - logs/kowalski-n=12
      - logs/kowalski-n=15
      - logs/kowalski-n=20
      - logs/kowalski-n=25
    outs:
      - paper/results.tex:
          cache: false
          persist: false
      - paper/figures/scaling.pdf:
          cache: false
          persist: false
      - results:
          cache: false
          persist: false
      - .calkit/notebooks/executed/notebooks/analyze-logs.ipynb:
          cache: false
      - .calkit/notebooks/html/notebooks/analyze-logs.html:
          cache: false
    desc: Automatically generated from the 'analyze-logs' stage in 
      calkit.yaml. Changes made here will be overwritten.
  plot-lightcurve:
    cmd: calkit xenv -n analyze-logs --no-check -- python 
      scripts/plot-lightcurve.py
    deps:
      - scripts/plot-lightcurve.py
      - data/SN2025kwy.parquet
      - .calkit/env-locks/analyze-logs
    outs:
      - paper/figures/SN2025kwy.pdf:
          cache: false
          persist: false
    desc: Automatically generated from the 'plot-lightcurve' stage in 
      calkit.yaml. Changes made here will be overwritten.
  build-paper:
    cmd: calkit latex build -e tex --no-check -f paper/main.tex
    deps:
      - paper/main.tex
      - paper/references.bib
      - paper/aasjournal.bst
      - paper/aastex631.cls
      - paper/results.tex
      - paper/diagrams
      - paper/figures
      - .calkit/env-locks/tex
    outs:
      - paper/main.pdf:
          cache: true
    desc: Automatically generated from the 'build-paper' stage in 
      calkit.yaml. Changes made here will be overwritten.
